name: Repository validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.0.4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck yamllint

      - name: Run repository validation
        run: make lint
